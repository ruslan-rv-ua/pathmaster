# Default locale manifest — submitted as
# manifests/r/RuslanIskov/PathMaster/<version>/RuslanIskov.PathMaster.locale.en-US.yaml
#
# Publisher and PackageName here must match the exe's VERSIONINFO (CompanyName / ProductName):
# for a portable install winget writes the Add/Remove Programs entry from THIS manifest, and
# consistency between the two is the only identity an unsigned binary has. The Rust side of
# that pairing is gated by `the_versioninfo_carries_the_identity_the_package_managers_were_built_from`
# in crates/pathmaster-core/tests/versioninfo.rs.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json
PackageIdentifier: "RuslanIskov.PathMaster"
PackageVersion: "0.1.0"
PackageLocale: "en-US"
Publisher: "Ruslan Iskov"
PublisherUrl: "https://github.com/ruslan-rv-ua"
PublisherSupportUrl: "https://github.com/ruslan-rv-ua/pathmaster/issues"
PackageName: "PathMaster"
PackageUrl: "https://github.com/ruslan-rv-ua/pathmaster"
License: "MIT"
# Pinned to the tag, like InstallerUrl and ReleaseNotesUrl above and below it: this manifest
# describes one version, so its licence link should show the licence *that version* shipped
# under, not whatever the default branch says years later. It also stops a published field
# depending on branch topology.
LicenseUrl: "https://github.com/ruslan-rv-ua/pathmaster/blob/v0.1.0/LICENSE"
Copyright: "Copyright (C) 2026 Ruslan Iskov"
ShortDescription: "Portable editor and diagnostics for the Windows PATH environment variable."
Description: |-
  PathMaster reads, edits and diagnoses the Windows PATH environment variable for the current
  user and for the machine. It reports folders that do not exist, relative paths, quoted
  entries, duplicates across both PATHs and a combined PATH too long for cmd.exe, and it has
  full undo.

  Accessibility is a design principle rather than a feature: every action has a keyboard route
  and a home in the menus, every message is shown as well as spoken, and the application sets no
  colours of its own, so the system theme and High Contrast apply as they are. Tested with NVDA.

  It is portable. Everything it writes — settings, snapshots and its log — lives in a `data`
  folder beside the executable, and a snapshot of a PATH is taken before that PATH is changed.
Moniker: "pathmaster"
Tags:
- "path"
- "environment-variables"
- "environment"
- "portable"
- "accessibility"
- "nvda"
- "registry"
- "utilities"
ReleaseNotesUrl: "https://github.com/ruslan-rv-ua/pathmaster/releases/tag/v0.1.0"
ManifestType: "defaultLocale"
ManifestVersion: "1.12.0"
