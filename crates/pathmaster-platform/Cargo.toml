[package]
name = "pathmaster-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PathMaster's imperative shell: registry, data directory, elevation — no wx"
publish = false

[dependencies]
pathmaster-core = { path = "../pathmaster-core" }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# The registry integration tests write degenerate values (double-NUL terminators,
# REG_BINARY) directly, bypassing the adapter under test.
[target.'cfg(windows)'.dev-dependencies]
winreg = "0.56"
