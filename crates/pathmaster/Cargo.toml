[package]
name = "pathmaster"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable Windows PATH editor, built for a screen-reader (NVDA) user first"
publish = false

# Bin-only, no lib target (ADR-0007): the GUI's coverage is the Release Checklist, and
# anything worth an automated test must first move down a tier.
[[bin]]
name = "PathMaster"
path = "src/main.rs"

[dependencies]
pathmaster-core = { path = "../pathmaster-core" }
pathmaster-platform = { path = "../pathmaster-platform" }
# ≥ 0.9.17: earlier AccRole discriminants are mis-ordered (ticket 01). Cargo.lock pins the
# exact resolved version; wxWidgets 3.3.3 is SHA256-pinned inside wxdragon-sys and compiled
# from source, statically, with crt-static propagating into the C++ build.
wxdragon = "0.9.17"

# Three callers, each a module of its own: announce() (ADR-0003) takes
# NotifyWinEvent and its constants, clipboard::copy takes the Win32 clipboard
# the Copy command writes through rather than wx's (v0.2.0 §8), and
# ui::fix_dialog takes the raw LVM_* hatch that wxdragon exposes no checkbox
# through (v0.2.0 §7).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
polib = "0.3"
