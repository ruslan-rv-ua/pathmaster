# THROWAWAY PROTOTYPE — wayfinder ticket 02 (NVDA baseline for a stock wxdragon shell).
# Exists only to be listened to with NVDA. Delete once ticket 02 is resolved.
[package]
name = "nvda-baseline-prototype"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# >= 0.9.17 per ticket 01: earlier AccRole discriminants are mis-ordered.
wxdragon = "0.9.18"

[[bin]]
name = "nvda-baseline"
path = "src/main.rs"

[profile.release]
opt-level = 2
