name: Update Scoop manifest

# Sends one `update-pathmaster` repository_dispatch to ruslan-rv-ua/scoop-bucket, which
# rewrites `bucket/pathmaster.json` from the payload and pushes it. This repository is the
# side that knows what a PathMaster release looks like; the bucket is the side that knows
# how to hold a manifest, and it serves all six applications the same way.
#
# The bucket does its own verification before it writes: it re-downloads the URL and
# compares the bytes GitHub actually serves against the hash sent here, then its CI
# validates the manifest structure and reverts the push if it is wrong. So the failure this
# workflow has to avoid is not "a bad manifest lands" - the bucket catches that - but
# "a correct release cannot be published because the hash was parsed wrong". Hence the
# shape check below.
#
# `bucket/pathmaster.json` must ALREADY EXIST there. The bucket's workflow fails on a
# missing `bucket/<app>.json` rather than creating one, so the first placement is by hand
# from packaging/scoop/pathmaster.json - that is release checklist step F9. This workflow
# is what bumps it every release after that.
#
# Hand-started, matching the other five applications in the bucket, because F9 is a human
# step that ends in `scoop install pathmaster`: the bump it verifies should be one a human
# asked for. Adding `release: {types: [published]}` to the triggers below is the single
# line that would make the chain automatic, if that trade is ever re-made.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 0.1.0). Empty = the latest release'
        required: false
        type: string

jobs:
  update-scoop:
    runs-on: ubuntu-latest

    env:
      BUCKET_REPO: ruslan-rv-ua/scoop-bucket
      APP_ID: pathmaster

    steps:
      - name: Read the release and its sidecar
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        # Normalised through env rather than interpolated into the script, so a crafted
        # input cannot become shell.
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q '.tagName' | sed 's/^v//')
          fi

          # The one place outside release.yml's Stage step that names the asset. The two are
          # kept in step by the release itself: a mismatch means `gh release download` below
          # finds no sidecar and this step fails, rather than dispatching a wrong URL.
          ASSET="PathMaster-v${VERSION}-x64.exe"

          # `#/PathMaster.exe` renames the download, which is what keeps `bin` and
          # `shortcuts` stable across versions while the release asset carries its version
          # in its name. The bucket strips the fragment before it downloads.
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${ASSET}#/PathMaster.exe"

          # The sidecar is sha256sum's own `<hex64> *<filename>` format, not a bare hash:
          # take the first field. Trimming whitespace instead - which works for a bare-hash
          # sidecar - would glue the filename onto the hash and fail in the bucket.
          HASH=$(gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
                   --pattern "${ASSET}.sha256" --output - | awk '{print $1}')

          # Self-sensitivity: an empty or reshaped sidecar would otherwise dispatch a
          # plausible-looking payload and fail two repositories away.
          if ! printf '%s' "$HASH" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "::error::sidecar did not yield a sha256: '$HASH'"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "HASH=$HASH"       >> "$GITHUB_OUTPUT"
          echo "URL=$URL"         >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "URL:     $URL"
          echo "Hash:    $HASH"

      - name: Dispatch to the bucket
        env:
          # A PAT with write access to the bucket - this repository's own token cannot
          # reach another repository. Stored as a secret named SCOOP_BUCKET_TOKEN.
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          VERSION: ${{ steps.info.outputs.VERSION }}
          HASH: ${{ steps.info.outputs.HASH }}
          URL: ${{ steps.info.outputs.URL }}
        # `gh api` rather than a third-party dispatch action: `gh` and `jq` are both already
        # on the runner, and this repository pins every action it uses by commit SHA - one
        # fewer pin to audit and keep current is worth more here than the action's sugar.
        run: |
          set -euo pipefail

          jq -n \
            --arg app "$APP_ID" \
            --arg version "$VERSION" \
            --arg hash "$HASH" \
            --arg url "$URL" \
            '{event_type: ("update-" + $app),
              client_payload: {app: $app, version: $version, hash: $hash, url: $url}}' \
          | gh api "repos/${BUCKET_REPO}/dispatches" --method POST --input -

          echo "Dispatched update-${APP_ID} ${VERSION} to ${BUCKET_REPO}"
          echo "Watch: https://github.com/${BUCKET_REPO}/actions"
