# Push CI (spec §18): cargo test + clippy + rustfmt on every push/PR to develop.
# The wx-linking targets are built here too — this is the CI "where wx is built anyway"
# that the binary's future smoke test relies on.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    name: cargo test + clippy + fmt
    runs-on: windows-2025
    env:
      # MAX_PATH: a deep build path breaks the wxWidgets build while blaming the
      # compiler (research/04) — keep the build tree at the drive root.
      CARGO_TARGET_DIR: C:\t
      # bindgen runs unconditionally in wxdragon-sys; the runner image ships LLVM but
      # libclang.dll is not discoverable without this (research/04).
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      # Pinned by commit, with the tag in the comment, the way release.yml pins: a moving
      # major tag is a third party's write access to this workflow. It also stops the
      # silent drift that put this file two majors behind release.yml on the same action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Load-bearing: wxdragon-sys hardcodes the Ninja CMake generator on x64 MSVC.
      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      # Before the build, deliberately: formatting needs no compilation, so a
      # drifted file fails here in seconds instead of after a wxWidgets build.
      # rustfmt is pinned as a component in rust-toolchain.toml.
      - name: Format
        run: cargo fmt --all -- --check

      # The wxWidgets static libs (~450 MB) sit at the profile root of the target dir
      # and dominate cold-build time — cache the whole build tree.
      - name: Cache build tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\t
          key: build-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
